name: Satoshi Studio Sequence Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/studio-smoke.trigger

permissions:
  contents: write

jobs:
  upstream-sequence:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
      SATOSHI_EDITORIAL_MODEL: gpt-5.6-sol
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install boto3
      - name: Run Research
        env:
          PYTHONPATH: .
        run: python studio/module_runner.py --episode games-as-latent-therapeutics-2026-09-30 --module research
      - name: Run Story
        env:
          PYTHONPATH: .
        run: python studio/module_runner.py --episode games-as-latent-therapeutics-2026-09-30 --module story
      - name: Run Script
        env:
          PYTHONPATH: .
        run: python studio/module_runner.py --episode games-as-latent-therapeutics-2026-09-30 --module script
      - name: Persist smoke-test state
        if: always()
        run: |
          git config user.name 'satoshi-studio-bot'
          git config user.email 'satoshi-studio-bot@users.noreply.github.com'
          git add studio/episodes/games-as-latent-therapeutics-2026-09-30
          if ! git diff --cached --quiet; then
            git commit -m 'studio smoke: research story script'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
