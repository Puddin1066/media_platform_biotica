name: Satoshi Studio Sequence Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/studio-smoke.trigger

permissions:
  contents: write

jobs:
  source:
    uses: ./.github/workflows/satoshi-studio-module.yml
    with:
      episode: games-as-latent-therapeutics-2026-09-30
      module: source
    secrets: inherit

  research:
    needs: source
    uses: ./.github/workflows/satoshi-studio-module.yml
    with:
      episode: games-as-latent-therapeutics-2026-09-30
      module: research
    secrets: inherit

  story:
    needs: research
    uses: ./.github/workflows/satoshi-studio-module.yml
    with:
      episode: games-as-latent-therapeutics-2026-09-30
      module: story
    secrets: inherit

  script:
    needs: story
    uses: ./.github/workflows/satoshi-studio-module.yml
    with:
      episode: games-as-latent-therapeutics-2026-09-30
      module: script
    secrets: inherit
