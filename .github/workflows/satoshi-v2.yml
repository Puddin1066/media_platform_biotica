name: Satoshi V2 Producer

on:
  push:
    branches:
      - feature/satoshi-multi-agent-director
    paths:
      - 'requests/satoshi_v2/current.json'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Instagram after successful render
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: satoshi-v2-producer
  cancel-in-progress: true

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUNWAY_LIVE_ENABLED: "true"
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      RUNWAY_AVATAR_ID: ${{ secrets.RUNWAY_AVATAR_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements-runway.txt boto3 jsonschema
          cd remotion && npm ci

      - name: Validate v2 pipeline
        run: python -m satoshi_v2.produce requests/satoshi_v2/current.json --validate-only

      - name: Produce reel
        shell: bash
        run: |
          set -euo pipefail
          publish=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            publish="${{ inputs.publish }}"
          fi
          args=(requests/satoshi_v2/current.json)
          if [[ "$publish" == "true" ]]; then
            args+=(--publish)
          fi
          python -m satoshi_v2.produce "${args[@]}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satoshi-v2-${{ github.run_id }}
          path: |
            outputs/satoshi-v2/
            remotion/out/
            remotion/public/satoshi-v2/
          if-no-files-found: warn
          retention-days: 14
