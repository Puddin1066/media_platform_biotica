name: Satoshi Production

on:
  workflow_dispatch:
    inputs:
      editorial_run_id:
        description: GitHub Actions run ID from Satoshi Editorial Pipeline A
        required: true
        type: string
      request_path:
        description: Original canonical request used by Pipeline A
        required: true
        default: requests/satoshi_editorial/current.json
        type: string
      live:
        description: Generate host/visuals and render final media
        required: true
        default: true
        type: boolean
      publish:
        description: Publish final Reel to Instagram after successful render
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: satoshi-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1-mini' }}
      OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'low' }}
      RUNWAY_LIVE_ENABLED: ${{ inputs.live && 'true' || 'false' }}
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      RUNWAY_AVATAR_ID: ${{ secrets.RUNWAY_AVATAR_ID }}
      SATOSHI_MASTER_HOST_R2_KEY: ${{ vars.SATOSHI_MASTER_HOST_R2_KEY }}
      SATOSHI_DEFAULT_PLATE_R2_KEY: ${{ vars.SATOSHI_DEFAULT_PLATE_R2_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install production dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements-runway.txt
          cd remotion && npm ci

      - name: Download approved Pipeline A package
        uses: actions/download-artifact@v4
        with:
          name: satoshi-editorial-${{ inputs.editorial_run_id }}
          path: inputs/pipeline-a
          github-token: ${{ github.token }}
          run-id: ${{ inputs.editorial_run_id }}

      - name: Run Pipeline B regression tests
        run: python -m unittest -v test_satoshi_production_pipeline.py

      - name: Render immutable Pipeline A package
        shell: bash
        run: |
          set -euo pipefail
          args=(--package inputs/pipeline-a --request "${{ inputs.request_path }}" --output outputs/satoshi-production)
          if [[ "${{ inputs.live }}" == "true" ]]; then
            args+=(--live)
          fi
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            args+=(--publish)
          fi
          python satoshi_production_pipeline.py "${args[@]}"

      - name: Return Instagram permalink
        if: inputs.live == true && inputs.publish == true
        shell: bash
        run: |
          set -euo pipefail
          python canonical_instagram_permalink.py --root outputs/satoshi-production

      - name: Summarize Pipeline B
        if: always()
        shell: bash
        run: |
          echo '## Satoshi Production Pipeline B' >> "$GITHUB_STEP_SUMMARY"
          find outputs/satoshi-production -name manifest.json -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload production package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satoshi-production-${{ github.run_id }}
          path: outputs/satoshi-production
          retention-days: 14
          if-no-files-found: error
