name: Satoshi Software Assembler

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Engineering mode
        type: choice
        options:
          - endpoint
          - maintenance
        default: endpoint
        required: true
      objective:
        description: Observable endpoint objective or maintenance objective
        type: string
        required: true
      reasoning:
        description: Planner reasoning effort
        type: choice
        options:
          - medium
          - high
        default: high
        required: true
      open_pr:
        description: Persist the plan on a branch and open a PR
        type: boolean
        default: true
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: satoshi-software-assembler-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
  OPENAI_LIVE_ENABLED: 'true'
  SATOSHI_ASSEMBLER_MODEL: gpt-5.6-sol

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate objective
        env:
          OBJECTIVE: ${{ inputs.objective }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os
          objective = os.environ['OBJECTIVE'].strip()
          if len(objective) < 20:
              raise SystemExit('Objective must be concrete enough to describe observable endpoint behavior')
          if len(objective) > 6000:
              raise SystemExit('Objective is too large; provide a bounded endpoint objective')
          print('mode=' + os.environ['MODE'])
          print('objective=' + objective)
          PY

      - name: Crawl architecture and generate engineering plan
        env:
          OBJECTIVE: ${{ inputs.objective }}
          REASONING: ${{ inputs.reasoning }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          objective="$OBJECTIVE"
          if [[ "$MODE" == maintenance ]]; then
            objective="Maintenance objective for Satoshi Studio: $objective. Inspect current canonical architecture, recent production paths, workflow/runtime contract mismatches, stale or duplicate entrypoints, missing regression tests, and endpoint observability. Prefer repair/consolidation over adding another pipeline."
          fi
          PYTHONPATH=. python studio/software_assembler.py plan --objective "$objective" --reasoning "$REASONING"

      - name: Resolve run directory
        run: echo "ASSEMBLER_RUN_DIR=studio/assembler/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Add plan to job summary
        run: cat "$ASSEMBLER_RUN_DIR/PLAN.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: satoshi-software-assembler-${{ github.run_id }}
          path: ${{ env.ASSEMBLER_RUN_DIR }}
          retention-days: 30

      - name: Persist plan and open PR
        if: ${{ inputs.open_pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          OBJECTIVE: ${{ inputs.objective }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          branch="assembler/run-${GITHUB_RUN_ID}"
          git config user.name 'satoshi-assembler-bot'
          git config user.email 'satoshi-assembler-bot@users.noreply.github.com'
          git checkout -b "$branch"
          git add "$ASSEMBLER_RUN_DIR"
          git commit -m "assembler: plan ${MODE} objective"
          git push origin "$branch"
          title="Satoshi assembler: ${MODE} plan ${GITHUB_RUN_ID}"
          body_file="$ASSEMBLER_RUN_DIR/PR_BODY.md"
          {
            echo '## Objective'
            echo
            echo "$OBJECTIVE"
            echo
            echo '## What this PR contains'
            echo
            echo '- repository architecture inventory'
            echo '- endpoint contract and gap analysis'
            echo '- ordered implementation plan with exact paths and tests'
            echo '- endpoint verification and maintenance requirements'
            echo
            echo 'This is a plan-first assembler run. It does not bypass CI, spend gates, publication approvals, or push model-generated implementation code directly to main.'
            echo
            echo 'Full plan: `'$ASSEMBLER_RUN_DIR'/PLAN.md`'
          } > "$body_file"
          git add "$body_file"
          git commit -m "assembler: add PR context"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body-file "$body_file"
