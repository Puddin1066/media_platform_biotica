name: Studio — Host

on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode workspace ID
        required: true
        default: games-as-latent-therapeutics-2026-09-30
        type: string
      allow_media_spend:
        description: Explicitly authorize paid media generation
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  module:
    uses: ./.github/workflows/satoshi-studio-module.yml
    with:
      episode: ${{ inputs.episode }}
      module: host
      allow_media_spend: ${{ inputs.allow_media_spend }}
    secrets: inherit
