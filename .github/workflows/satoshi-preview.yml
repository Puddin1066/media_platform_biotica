name: Satoshi Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/satoshi-multi-agent-director
    paths:
      - 'requests/satoshi/current.json'

permissions:
  contents: read

jobs:
  preview:
    uses: ./.github/workflows/satoshi-runtime.yml
    with:
      profile: preview
      publish: false
    secrets: inherit
