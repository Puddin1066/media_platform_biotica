name: Pilot Huberman Rhetoric Mechanics

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of source episodes to pilot (1-3)"
        required: true
        default: "1"
  push:
    branches: [main]
    paths:
      - ".github/pilot-huberman.once"

jobs:
  pilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPEN_AI_API }}
      OPENAI_LIVE_ENABLED: "true"
      PILOT_LIMIT: ${{ github.event.inputs.limit || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate limit
        run: |
          case "$PILOT_LIMIT" in
            1|2|3) ;;
            *) echo "limit must be 1-3"; exit 1 ;;
          esac
      - name: Run controlled pilot
        run: python huberman_pilot.py --limit "$PILOT_LIMIT" --output-dir artifacts/huberman-pilot
      - name: Confirm raw transcripts are absent
        run: |
          if find artifacts -type f \( -name '*.txt' -o -name '*.html' \) | grep -q .; then
            echo "Raw source material must not be retained in artifacts"
            exit 1
          fi
      - name: Upload neutralized mechanics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huberman-neutralized-mechanics
          path: artifacts/huberman-pilot
          if-no-files-found: error
          retention-days: 7
