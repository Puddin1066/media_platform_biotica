name: Pilot Huberman Rhetoric Mechanics

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of source episodes to process (1-25)"
        required: true
        default: "25"

jobs:
  pilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      OPENAI_LIVE_ENABLED: "true"
      PILOT_LIMIT: ${{ github.event.inputs.limit || '25' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate limit
        run: |
          python - <<'PY'
          import os
          value = int(os.environ["PILOT_LIMIT"])
          if not 1 <= value <= 25:
              raise SystemExit("limit must be 1-25")
          PY
      - name: Probe OpenAI Responses API
        run: python openai_probe.py
      - name: Run controlled corpus build
        run: python huberman_pilot.py --limit "$PILOT_LIMIT" --output-dir artifacts/huberman-pilot
      - name: Build pre-embedding mechanics library
        if: success()
        run: python mechanics_cluster.py --source-dir artifacts/huberman-pilot --output artifacts/huberman-pilot/mechanics-library.json
      - name: Confirm raw transcripts are absent
        if: always()
        run: |
          if find artifacts -type f \( -name '*.txt' -o -name '*.html' \) | grep -q .; then
            echo "Raw source material must not be retained in artifacts"
            exit 1
          fi
      - name: Upload neutralized mechanics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huberman-neutralized-mechanics
          path: artifacts/huberman-pilot
          if-no-files-found: error
          retention-days: 7
