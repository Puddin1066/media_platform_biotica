name: Build Satoshi Production Readiness Pack V1

on:
  push:
    branches:
      - feature/satoshi-multi-agent-director
    paths:
      - '.github/workflows/build-satoshi-production-readiness-v1.yml'
      - 'studio/production_readiness_pack_v1.json'
      - 'studio/generate_production_readiness_pack_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNWAY_LIVE_ENABLED: "true"
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Runway/R2 dependencies
        run: pip install -r requirements-runway.txt
      - name: Generate production-readiness asset pack
        run: python studio/generate_production_readiness_pack_v1.py
      - name: Upload diagnostic manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satoshi-production-readiness-${{ github.run_id }}
          path: |
            outputs/satoshi-production-ready/production-readiness-pack-v1-result.json
            outputs/satoshi-production-ready/jobs/
          if-no-files-found: warn
          retention-days: 7
