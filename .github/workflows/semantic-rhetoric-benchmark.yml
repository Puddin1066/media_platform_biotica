name: Real-Evidence Rhetoric Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - human-rhetoric-calibration
    paths:
      - '.github/real-rhetoric.trigger'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      OPENAI_LIVE_ENABLED: "true"
      OPENAI_EMBED_DIMENSIONS: "768"
      FROZEN_CORPUS_DIR: rhetoric_corpus/frozen
      FROZEN_INDEX_PATH: rhetoric_corpus/frozen/semantic-index.json
      RHETORIC_INDEX_PATH: rhetoric_corpus/frozen/semantic-index.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Probe OpenAI Responses API
        run: python openai_probe.py
      - name: Run offline rhetoric and human-review tests
        run: python -m pytest -q test_semantic_rhetoric.py test_real_rhetoric_benchmark.py test_human_rhetoric_review.py
      - name: Detect frozen rhetoric corpus
        id: corpus
        shell: bash
        run: |
          if compgen -G "$FROZEN_CORPUS_DIR/*.mechanics.json" > /dev/null && [ -f "$FROZEN_CORPUS_DIR/manifest.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap frozen 25-episode neutral mechanics once
        if: steps.corpus.outputs.exists != 'true'
        run: python huberman_pilot.py --limit 25 --output-dir artifacts/huberman-pilot
      - name: Confirm bootstrap contains no raw transcripts
        if: steps.corpus.outputs.exists != 'true'
        run: |
          if find artifacts/huberman-pilot -type f \( -name '*.txt' -o -name '*.html' \) | grep -q .; then
            echo "Raw source material must not be retained"
            exit 1
          fi
      - name: Freeze validated derived mechanics
        if: steps.corpus.outputs.exists != 'true'
        shell: bash
        run: |
          mkdir -p "$FROZEN_CORPUS_DIR"
          cp artifacts/huberman-pilot/*.mechanics.json "$FROZEN_CORPUS_DIR/"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from semantic_rhetoric import load_mechanics

          root = Path("rhetoric_corpus/frozen")
          rows = load_mechanics(root)
          episodes = {row["episode_id"] for row in rows}
          assert len(episodes) == 25, len(episodes)
          assert len(rows) > 0
          digest = hashlib.sha256(json.dumps(rows, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          manifest = {
              "schema_version": 2,
              "source_policy": "huberman_lab_solo_only",
              "source_text_included": False,
              "creator_voice_imitation": False,
              "episode_count": len(episodes),
              "mechanic_count": len(rows),
              "mechanics_sha256": digest,
              "frozen": True,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FROZEN_CORPUS_DIR"/*.mechanics.json "$FROZEN_CORPUS_DIR/manifest.json"
          git commit -m "Freeze validated rhetoric mechanics corpus"
          git push origin HEAD:human-rhetoric-calibration
      - name: Validate frozen rhetoric corpus
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from semantic_rhetoric import load_mechanics

          root = Path("rhetoric_corpus/frozen")
          rows = load_mechanics(root)
          episodes = {row["episode_id"] for row in rows}
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(json.dumps(rows, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          assert len(episodes) == manifest["episode_count"] == 25
          assert len(rows) == manifest["mechanic_count"] > 0
          assert digest == manifest["mechanics_sha256"]
          assert manifest["source_text_included"] is False
          assert manifest["creator_voice_imitation"] is False
          assert manifest["frozen"] is True
          print(f"frozen_corpus_ok episodes={len(episodes)} mechanics={len(rows)} sha256={digest}")
          PY
      - name: Detect frozen rhetoric embeddings
        id: index
        shell: bash
        run: |
          if [ -f "$FROZEN_INDEX_PATH" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build frozen rhetoric embeddings once
        if: steps.index.outputs.exists != 'true'
        run: python freeze_rhetoric_index.py --source-dir "$FROZEN_CORPUS_DIR" --index-path "$FROZEN_INDEX_PATH"
      - name: Persist frozen rhetoric embeddings
        if: steps.index.outputs.exists != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FROZEN_INDEX_PATH"
          git commit -m "Freeze rhetoric embedding index"
          git push origin HEAD:human-rhetoric-calibration
      - name: Validate frozen rhetoric embeddings
        run: python freeze_rhetoric_index.py --source-dir "$FROZEN_CORPUS_DIR" --index-path "$FROZEN_INDEX_PATH" --validate-only
      - name: Run real-evidence blinded benchmark
        run: python run_real_rhetoric_benchmark.py --source-dir "$FROZEN_CORPUS_DIR" --output-dir artifacts/real-rhetoric --top-k 3
      - name: Build human blind-review packet
        run: |
          python human_rhetoric_review.py make-packet \
            --benchmark artifacts/real-rhetoric/real-evidence-benchmark.json \
            --output-dir artifacts/human-review
          mv artifacts/human-review/blind-key.json artifacts/real-rhetoric/human-blind-key.json
      - name: Upload human blind-review packet
        uses: actions/upload-artifact@v4
        with:
          name: human-real-rhetoric-review
          path: artifacts/human-review
          if-no-files-found: error
          retention-days: 14
      - name: Upload derived benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-evidence-rhetoric-benchmark
          path: artifacts/real-rhetoric
          if-no-files-found: error
          retention-days: 14
