name: Real-Evidence Rhetoric Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - human-rhetoric-calibration
    paths:
      - '.github/real-rhetoric.trigger'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
      OPENAI_LIVE_ENABLED: "true"
      OPENAI_EMBED_DIMENSIONS: "768"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Probe OpenAI Responses API
        run: python openai_probe.py
      - name: Run offline rhetoric and human-review tests
        run: python -m pytest -q test_semantic_rhetoric.py test_real_rhetoric_benchmark.py test_human_rhetoric_review.py
      - name: Regenerate 25-episode neutral mechanics
        run: python huberman_pilot.py --limit 25 --output-dir artifacts/huberman-pilot
      - name: Confirm raw transcripts are absent
        run: |
          if find artifacts -type f \( -name '*.txt' -o -name '*.html' \) | grep -q .; then
            echo "Raw source material must not be retained"
            exit 1
          fi
      - name: Run real-evidence blinded benchmark
        run: python real_rhetoric_benchmark.py --source-dir artifacts/huberman-pilot --output-dir artifacts/real-rhetoric --top-k 3
      - name: Build human blind-review packet
        run: |
          python human_rhetoric_review.py make-packet \
            --benchmark artifacts/real-rhetoric/real-evidence-benchmark.json \
            --output-dir artifacts/human-review
          mv artifacts/human-review/blind-key.json artifacts/real-rhetoric/human-blind-key.json
      - name: Upload human blind-review packet
        uses: actions/upload-artifact@v4
        with:
          name: human-real-rhetoric-review
          path: artifacts/human-review
          if-no-files-found: error
          retention-days: 14
      - name: Upload derived benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-evidence-rhetoric-benchmark
          path: artifacts/real-rhetoric
          if-no-files-found: error
          retention-days: 14
