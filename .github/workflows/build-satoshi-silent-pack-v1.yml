name: Build Satoshi Silent Reaction Pack V1

on:
  push:
    branches:
      - feature/satoshi-multi-agent-director
    paths:
      - '.github/workflows/build-satoshi-silent-pack-v1.yml'
      - 'studio/characters/satoshi-v1/silent_reaction_pack_v1.json'
      - 'studio/characters/satoshi-v1/generate_silent_reaction_pack_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  silent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNWAY_LIVE_ENABLED: "true"
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Runway/R2 dependencies
        run: pip install -r requirements-runway.txt
      - name: Generate first three reusable silent Satoshi clips
        run: python studio/characters/satoshi-v1/generate_silent_reaction_pack_v1.py
      - name: Upload diagnostic manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satoshi-v1-silent-pack-${{ github.run_id }}
          path: |
            outputs/satoshi-character/silent-reaction-pack-v1-result.json
            outputs/satoshi-character/silent-jobs/
          if-no-files-found: warn
          retention-days: 7
