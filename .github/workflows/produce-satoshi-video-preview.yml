name: Produce Satoshi Video Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requests/satoshi/current.json'
      - 'SATOSHI_PERSONA.md'
      - 'writing_contract.py'
      - 'produce.py'
      - 'narrative_mode.py'
      - 'reference_corpus.py'
      - 'rhetoric_retrieval.py'
      - 'speech_provider.py'
      - 'singular_video_preview.py'
      - 'monologue_grammar.py'
      - 'references/corpus/**'
      - 'satoshi_supervisor.py'
      - 'maintenance_agent.py'
      - 'positioning.py'
      - 'satoshi_short.py'
      - 'unreviewed_video_preview.py'
      - 'episode.py'
      - 'runway_media.py'
      - 'media_store.py'
      - 'persist_media.py'
      - 'provider_readiness.py'
      - 'test_narrative_mode.py'
      - 'test_writing_contract.py'
      - 'test_production.py'
      - 'remotion/src/root.tsx'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: satoshi-video-preview
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_LIVE_ENABLED: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
      SATOSHI_MAINTENANCE_MODEL: "gpt-5.6-sol"
      SATOSHI_SPEECH_PROVIDER: ${{ vars.SATOSHI_SPEECH_PROVIDER || 'auto' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_multilingual_v2' }}
      SATOSHI_EMBED_RETRIEVAL_ENABLED: ${{ vars.SATOSHI_EMBED_RETRIEVAL_ENABLED || 'true' }}
      SATOSHI_CORPUS_DB: ${{ vars.SATOSHI_CORPUS_DB || 'private/corpus/corpus.sqlite' }}
      RUNWAY_LIVE_ENABLED: "true"
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      RUNWAY_VOICE_PRESET: ${{ vars.RUNWAY_VOICE_PRESET || 'Vincent' }}
      RUNWAY_AVATAR_ID: ${{ secrets.RUNWAY_AVATAR_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
      SATOSHI_PROVIDER_CACHE: outputs/provider-cache
      SATOSHI_SUPERVISOR_STATE: outputs/supervisor/state.json
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Restore assembly checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            outputs/provider-cache
            outputs/supervisor
            outputs/satoshi-short
            outputs/video-preview
            remotion/out
            private/corpus
          key: satoshi-assembly-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            satoshi-assembly-${{ runner.os }}-
            satoshi-provider-${{ runner.os }}-

      - name: Prepare directories
        run: mkdir -p outputs/provider-cache outputs/supervisor outputs/satoshi-short outputs/video-preview remotion/out dist/video dist/debug private/corpus

      - name: Install production dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements-runway.txt
          cd remotion && npm ci && npm run typecheck

      - name: Verify providers and durable media store
        run: |
          python provider_readiness.py --mode research_script
          python provider_readiness.py --mode video_preview
          python -m unittest -v

      - name: Try supervised assembly
        id: initial
        shell: bash
        run: |
          set +e
          python satoshi_supervisor.py 2>&1 | tee /tmp/satoshi-supervisor.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist collected paid media
        if: always()
        shell: bash
        run: |
          python persist_media.py \
            --root outputs/video-preview \
            --root remotion/out \
            --manifest outputs/media-manifest.json

      - name: Bounded OpenAI maintenance repair
        id: repair
        if: steps.initial.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/maintenance-history.txt
          validated_patch=false
          assembly_success=false

          echo "Maintenance repair attempt 1" | tee -a /tmp/maintenance-history.txt
          set +e
          python maintenance_agent.py --output "outputs/supervisor/maintenance-agent-1.json" 2>&1 | tee -a /tmp/maintenance-history.txt
          agent_code=${PIPESTATUS[0]}
          set -e

          if [[ "$agent_code" == "2" ]]; then
            echo "Agent requested human intervention" | tee -a /tmp/maintenance-history.txt
          elif [[ "$agent_code" != "0" ]]; then
            echo "Agent failed policy/runtime checks" | tee -a /tmp/maintenance-history.txt
          else
            changed="$(git diff --name-only)"
            if [[ -z "$changed" ]]; then
              echo "Agent made no repository changes" | tee -a /tmp/maintenance-history.txt
            else
              while IFS= read -r path; do
                case "$path" in
                  positioning.py|satoshi_short.py|satoshi_supervisor.py|unreviewed_video_preview.py|episode.py|runway_media.py|provider_readiness.py|test_production.py|remotion/src/root.tsx) ;;
                  *) echo "Non-allowlisted change: $path" >&2; exit 1 ;;
                esac
              done <<< "$changed"

              python -m unittest -v
              (cd remotion && npm run typecheck)
              validated_patch=true

              set +e
              python satoshi_supervisor.py 2>&1 | tee /tmp/satoshi-supervisor.log
              supervisor_code=${PIPESTATUS[0]}
              set -e
              if [[ "$supervisor_code" == "0" ]]; then
                assembly_success=true
              else
                echo "Validated repair advanced pipeline but another blocker remains" | tee -a /tmp/maintenance-history.txt
              fi
            fi
          fi

          echo "validated_patch=$validated_patch" >> "$GITHUB_OUTPUT"
          echo "assembly_success=$assembly_success" >> "$GITHUB_OUTPUT"

      - name: Persist media after maintenance
        if: always()
        shell: bash
        run: |
          python persist_media.py \
            --root outputs/video-preview \
            --root remotion/out \
            --manifest outputs/media-manifest.json

      - name: Open audited repair PR
        id: pr
        if: steps.initial.outputs.exit_code != '0' && steps.repair.outputs.validated_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair diff to propose"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="agent-repair/${GITHUB_RUN_ID}"
          git config user.name "Biotica Maintenance Agent"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add positioning.py satoshi_short.py satoshi_supervisor.py unreviewed_video_preview.py episode.py runway_media.py provider_readiness.py test_production.py remotion/src/root.tsx
          git commit -m "Agent repair Satoshi pipeline run ${GITHUB_RUN_ID}"
          git push origin "$branch"
          diagnosis="$(python - <<'PY'
          import glob,json
          paths=sorted(glob.glob('outputs/supervisor/maintenance-agent-*.json'))
          if not paths:
              print('Bounded maintenance repair')
          else:
              data=json.load(open(paths[-1], encoding='utf-8'))
              print(data.get('diagnosis','Bounded maintenance repair').replace('\n',' ')[:1500])
          PY
          )"
          pr_url="$(gh pr create --base main --head "$branch" --title "Agent repair: Satoshi pipeline ${GITHUB_RUN_ID}" --body "Automated bounded maintenance repair for production run ${GITHUB_RUN_ID}.\n\nDiagnosis: ${diagnosis}\n\nPolicy: only allowlisted pipeline files changed; full Python tests and Remotion typecheck passed. test_production.py may only be changed for narrow provider SDK mock-contract synchronization and may not remove tests or weaken safety/publication/evidence controls. The repair is persisted even if it exposes a different downstream blocker; merging it triggers a fresh run that resumes from durable checkpoints.")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Merge validated repair PR
        if: steps.pr.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch

      - name: Require useful progress
        shell: bash
        run: |
          if [[ "${{ steps.initial.outputs.exit_code }}" == "0" ]]; then
            exit 0
          fi
          if [[ "${{ steps.repair.outputs.assembly_success }}" == "true" ]]; then
            exit 0
          fi
          [[ "${{ steps.pr.outputs.created }}" == "true" ]]

      - name: Package current state
        if: always()
        shell: bash
        run: |
          mkdir -p dist/video dist/debug
          python satoshi_supervisor.py --status-only > dist/debug/supervisor-state.json || true
          cp -f /tmp/satoshi-supervisor.log dist/debug/supervisor.log 2>/dev/null || true
          cp -f /tmp/maintenance-history.txt dist/debug/maintenance-history.txt 2>/dev/null || true
          cp -f outputs/supervisor/maintenance-agent-*.json dist/debug/ 2>/dev/null || true
          cp -f outputs/media-manifest.json dist/video/media-manifest.json 2>/dev/null || true
          cp -f outputs/video-preview/storyboard.json dist/video/ 2>/dev/null || true
          cp -f outputs/video-preview/visual-direction.json dist/video/ 2>/dev/null || true
          cp -f outputs/video-preview/footage-plan.json dist/video/ 2>/dev/null || true
          cp -f outputs/video-preview/generated/timing.json dist/video/ 2>/dev/null || true
          cp -rf outputs/video-preview/generated/alignment dist/video/ 2>/dev/null || true
          cp -f remotion/public/episode.json dist/video/ 2>/dev/null || true
          if [[ -f remotion/out/reel.mp4 ]]; then
            cp remotion/out/reel.mp4 dist/video/final.mp4
            printf '%s\n' rendered > dist/video/STATUS.txt
          else
            printf '%s\n' assembly_blocked > dist/video/STATUS.txt
          fi
          printf '%s\n' \
            'UNREVIEWED PREVIEW ONLY' \
            'Publication requires explicit human approval.' \
            > dist/video/REVIEW_REQUIRED.txt

      - name: Persist final rendered media
        if: always()
        shell: bash
        run: |
          python persist_media.py \
            --root outputs/video-preview \
            --root remotion/out \
            --root dist/video \
            --manifest dist/video/media-manifest.json

      - name: Save assembly checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            outputs/provider-cache
            outputs/supervisor
            outputs/satoshi-short
            outputs/video-preview
            remotion/out
            private/corpus
          key: satoshi-assembly-${{ runner.os }}-${{ github.run_id }}

      - name: Upload production package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satoshi-video-preview-${{ github.run_id }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
