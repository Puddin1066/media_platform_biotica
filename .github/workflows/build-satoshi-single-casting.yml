name: Build Satoshi Single-Subject Casting

on:
  push:
    branches:
      - feature/satoshi-multi-agent-director
    paths:
      - '.github/workflows/build-satoshi-single-casting.yml'
      - 'studio/characters/satoshi-v1/single_subject_casting.json'
      - 'studio/characters/satoshi-v1/generate_single_subject_casting.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  casting:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNWAY_LIVE_ENABLED: "true"
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Runway/R2 dependencies
        run: pip install -r requirements-runway.txt
      - name: Generate eight single-subject Satoshi casting portraits
        run: python studio/characters/satoshi-v1/generate_single_subject_casting.py
      - name: Upload diagnostic manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satoshi-v1-single-casting-${{ github.run_id }}
          path: |
            outputs/satoshi-character/single-subject-casting-result.json
            outputs/satoshi-character/jobs/
          if-no-files-found: warn
          retention-days: 7
