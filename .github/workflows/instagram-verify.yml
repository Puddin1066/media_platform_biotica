name: Instagram Publish Verify

on:
  push:
    branches:
      - feature/satoshi-multi-agent-director
    paths:
      - '.github/workflows/instagram-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify configured account and Tetris media
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ["META_ACCESS_TOKEN"]
          version=os.environ.get("META_GRAPH_VERSION","v25.0")
          user=os.environ["IG_USER_ID"]
          media="18139502449612969"
          def get(obj, fields):
              q=urllib.parse.urlencode({"fields":fields,"access_token":token})
              with urllib.request.urlopen(f"https://graph.facebook.com/{version}/{obj}?{q}", timeout=30) as r:
                  return json.load(r)
          acct=get(user,"id,username,name")
          item=get(media,"id,username,permalink,timestamp,media_type,caption")
          print("ACCOUNT", json.dumps(acct, sort_keys=True))
          print("MEDIA", json.dumps(item, sort_keys=True))
          PY
