name: Satoshi Studio Module

on:
  workflow_call:
    inputs:
      episode:
        description: Episode workspace ID
        required: true
        type: string
      module:
        description: Module to run
        required: true
        type: string
      allow_media_spend:
        description: Explicit authorization for Assets or Host provider jobs
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      episode:
        description: Episode workspace ID
        required: true
        default: games-as-latent-therapeutics-2026-09-30
        type: string
      module:
        description: Module to run
        required: true
        default: source
        type: choice
        options:
          - source
          - research
          - story
          - script
          - prosody
          - voice
          - audio_review
          - alignment
          - visual_plan
          - assets
          - host
          - assembly
          - publish
      allow_media_spend:
        description: Explicitly authorize paid media generation
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: satoshi-studio-state
  cancel-in-progress: false

env:
  STUDIO_EPISODE: ${{ inputs.episode }}
  STUDIO_MODULE: ${{ inputs.module }}
  STUDIO_ALLOW_MEDIA_SPEND: ${{ inputs.allow_media_spend }}
  OPENAI_LIVE_ENABLED: 'true'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
  OPENAI_EDITORIAL_MODEL: gpt-5.6-sol
  OPENAI_EDITORIAL_REASONING: high
  OPENAI_RESEARCH_MODEL: gpt-5.6-terra
  OPENAI_RESEARCH_REASONING: medium
  OPENAI_STORY_MODEL: gpt-5.6-terra
  OPENAI_STORY_REASONING: medium
  OPENAI_SCRIPT_MODEL: gpt-5.6-terra
  OPENAI_SCRIPT_REASONING: medium
  OPENAI_WRITING_MODEL: gpt-5.6-terra
  OPENAI_WRITING_REASONING: medium
  OPENAI_CLASSIFICATION_MODEL: gpt-5.6-luna
  OPENAI_CLASSIFICATION_REASONING: low
  SATOSHI_EDITORIAL_TTS_MODEL: gpt-4o-mini-tts
  SATOSHI_EDITORIAL_TTS_VOICE: cedar
  PLATE_HOST_MAX_CREDITS: ${{ vars.PLATE_HOST_MAX_CREDITS || '650' }}
  RUNWAY_LIVE_ENABLED: 'true'
  RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
  RUNWAY_AVATAR_ID: ${{ secrets.RUNWAY_AVATAR_ID }}
  SATOSHI_MASTER_HOST_R2_KEY: ${{ vars.SATOSHI_MASTER_HOST_R2_KEY }}
  SATOSHI_DEFAULT_PLATE_R2_KEY: ${{ vars.SATOSHI_DEFAULT_PLATE_R2_KEY }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}
  SATOSHI_AUDIO_JUDGE_MODEL: gpt-audio-1.5
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}

jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: inputs.module == 'assembly'
        with:
          node-version: '22'

      - name: Install media storage dependencies
        if: contains(fromJSON('["voice","audio_review","alignment","assets","host","assembly","publish"]'), inputs.module)
        run: pip install boto3

      - name: Install Runway and audio verification dependencies
        if: inputs.module == 'host'
        run: pip install -r requirements-runway.txt numpy

      - name: Install FFmpeg
        if: contains(fromJSON('["audio_review","alignment","host","assembly"]'), inputs.module)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install renderer
        if: inputs.module == 'assembly'
        run: cd remotion && npm ci

      - name: Run selected module
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          if [[ "$STUDIO_MODULE" == "voice" ]]; then
            python - <<'PY'
          import os
          import sys
          from studio import module_runner

          original_render_take = module_runner.base.render_take

          def render_verbatim(text, instructions, target, key, model, voice):
              locked = (
                  "VERBATIM LOCK: Read the supplied input exactly as written. "
                  "Do not omit, summarize, compress, reorder, substitute, or paraphrase any word. "
                  "Preserve every number and proper noun. Natural delivery may vary, but wording may not change. "
              )
              return original_render_take(text, locked + instructions, target, key, model, voice)

          module_runner.base.render_take = render_verbatim
          sys.argv = [
              "studio/module_runner.py",
              "--episode", os.environ["STUDIO_EPISODE"],
              "--module", os.environ["STUDIO_MODULE"],
          ]
          raise SystemExit(module_runner.main())
          PY
          else
            python studio/module_runner.py \
              --episode "$STUDIO_EPISODE" \
              --module "$STUDIO_MODULE"
          fi

      - name: Return published Instagram link
        if: inputs.module == 'publish'
        run: python canonical_instagram_permalink.py --root outputs/studio

      - name: Persist episode state
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'satoshi-studio-bot'
          git config user.email 'satoshi-studio-bot@users.noreply.github.com'

          # Save only this run's generated state as a patch. Then reset to the
          # latest main before applying it. This avoids rebasing a generated
          # library.json commit against another run that changed the same file.
          git add "studio/episodes/$STUDIO_EPISODE"
          if [[ -f studio/library_index.json ]]; then
            git add studio/library_index.json
          fi
          if git diff --cached --quiet; then
            echo 'No episode-state changes to commit.'
          else
            git diff --cached --binary > /tmp/studio-state.patch
            git reset --hard HEAD
            git fetch origin main
            git reset --hard origin/main
            if ! git apply --3way --index /tmp/studio-state.patch; then
              echo 'Episode state overlaps newer main state; preserving current run artifact instead of failing the media job.'
              mkdir -p /tmp/studio-state-conflict
              cp /tmp/studio-state.patch /tmp/studio-state-conflict/studio-state.patch
              exit 0
            fi
            git commit -m "studio($STUDIO_EPISODE): $STUDIO_MODULE"
            git push origin HEAD:main
          fi

      - name: Upload debug outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-${{ inputs.episode }}-${{ inputs.module }}-${{ github.run_id }}
          path: |
            studio/episodes/${{ inputs.episode }}
            outputs/studio/${{ inputs.episode }}
            /tmp/studio-state-conflict
          if-no-files-found: warn
          retention-days: 14
