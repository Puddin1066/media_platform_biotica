name: Satoshi Studio Library Index

on:
  push:
    branches: [main]
    paths:
      - 'studio_library.py'
      - 'studio/episodes/**/episode_manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: satoshi-studio-state
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive current text outputs and refresh backlog
        run: python studio_library.py backfill > /tmp/studio-library-plan.json
      - name: Commit versioned snapshots and index
        run: |
          set -euo pipefail
          git config user.name 'satoshi-studio-bot'
          git config user.email 'satoshi-studio-bot@users.noreply.github.com'
          git add studio/episodes studio/library_index.json
          if git diff --cached --quiet; then
            echo 'Library already up to date.'
          else
            git commit -m 'studio: index existing episode artifacts'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload read-only backlog plan
        uses: actions/upload-artifact@v4
        with:
          name: studio-library-plan-${{ github.run_id }}
          path: /tmp/studio-library-plan.json
          retention-days: 14
