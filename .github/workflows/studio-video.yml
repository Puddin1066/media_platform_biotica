name: Satoshi Studio Video

on:
  push:
    branches: [main]
    paths: ['studio/video_request.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: satoshi-studio-state
  cancel-in-progress: false

env:
  STUDIO_ALLOW_MEDIA_SPEND: 'true'
  OPENAI_LIVE_ENABLED: 'true'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
  OPENAI_IMAGE_MODEL: ${{ vars.STUDIO_IMAGE_MODEL || 'gpt-image-2.5-flare' }}
  OPENAI_IMAGE_QUALITY: ${{ vars.STUDIO_IMAGE_QUALITY || 'high' }}
  OPENAI_EDITORIAL_MODEL: gpt-5.6-sol
  OPENAI_EDITORIAL_REASONING: high
  OPENAI_RESEARCH_MODEL: gpt-5.6-terra
  OPENAI_RESEARCH_REASONING: medium
  OPENAI_STORY_MODEL: gpt-5.6-terra
  OPENAI_STORY_REASONING: medium
  OPENAI_SCRIPT_MODEL: gpt-5.6-terra
  OPENAI_SCRIPT_REASONING: medium
  OPENAI_WRITING_MODEL: gpt-5.6-terra
  OPENAI_WRITING_REASONING: medium
  OPENAI_CLASSIFICATION_MODEL: gpt-5.6-luna
  OPENAI_CLASSIFICATION_REASONING: low
  SATOSHI_EDITORIAL_TTS_MODEL: gpt-4o-mini-tts
  SATOSHI_EDITORIAL_TTS_VOICE: cedar
  PLATE_HOST_MAX_CREDITS: ${{ vars.PLATE_HOST_MAX_CREDITS || '650' }}
  RUNWAY_LIVE_ENABLED: 'true'
  RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
  RUNWAY_AVATAR_ID: ${{ secrets.RUNWAY_AVATAR_ID }}
  SATOSHI_MASTER_HOST_R2_KEY: ${{ vars.SATOSHI_MASTER_HOST_R2_KEY }}
  SATOSHI_DEFAULT_PLATE_R2_KEY: ${{ vars.SATOSHI_DEFAULT_PLATE_R2_KEY }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}
  SATOSHI_AUDIO_JUDGE_MODEL: gpt-audio-1.5
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read explicit video request
        run: |
          python - <<'PY'
          import json, os, re
          request = json.load(open('studio/video_request.json'))
          episode = request['episode']
          if not re.fullmatch(r'[a-z0-9][a-z0-9-]{2,120}', episode):
              raise ValueError('Invalid episode ID')
          if request.get('allow_media_spend') is not True and request.get('editorial_cutaway_from_completed_host') is not True:
              raise ValueError('Video request must explicitly authorize media spend')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('STUDIO_EPISODE=' + episode + '\n')
              out.write('STUDIO_ALLOW_MEDIA_SPEND=' + str(request.get('allow_media_spend') is True).lower() + '\n')
          PY
      - name: Install production tools once
        run: |
          pip install -r requirements-runway.txt numpy
          if ! command -v ffmpeg >/dev/null; then sudo apt-get install -y ffmpeg; fi
          cd remotion && npm ci
      - name: Execute existing Studio modules and save each stage
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          git config user.name 'satoshi-studio-bot'
          git config user.email 'satoshi-studio-bot@users.noreply.github.com'
          if python -c "import json,sys; sys.exit(0 if json.load(open('studio/video_request.json')).get('editorial_cutaway_from_completed_host') is True else 1)"; then
            python studio/cutaway_preview.py --episode "$STUDIO_EPISODE"
          fi
          for module in source research story script prosody voice audio_review alignment visual_plan assets host assembly; do
            status=$(python -c "import json,os; x=json.load(open('studio/episodes/'+os.environ['STUDIO_EPISODE']+'/episode_manifest.json')); print(x['modules'].get('$module',{}).get('status','not_ready'))")
            if [[ "$status" == completed || "$status" == approved || "$status" == needs_review ]]; then
              echo "Reusing saved $module"
              continue
            fi
            set +e
            python studio/module_runner.py --episode "$STUDIO_EPISODE" --module "$module"
            result=$?
            set -e

            if [[ "$module" == host && "$result" != 0 ]]; then
              if python - <<'PY'
          import json, os, pathlib, sys
          if json.load(open('studio/video_request.json')).get('require_speech_driven_host'): sys.exit(1)
          episode = os.environ['STUDIO_EPISODE']
          p = pathlib.Path('studio/episodes') / episode / 'artifacts/host_readiness.json'
          if not p.exists(): sys.exit(1)
          x = json.load(open(p))
          available, estimated = x.get('available_credits'), x.get('estimated_credits')
          if not isinstance(available, (int,float)) or not isinstance(estimated,(int,float)) or available >= estimated: sys.exit(1)
          request_path = pathlib.Path('studio/episodes') / episode / 'request.json'
          request = json.load(open(request_path))
          requested = dict(request.get('host') or {})
          request['host'] = {'mode':'master_asset','r2_key':requested.get('r2_key') or ''}
          request.setdefault('production', {})['host_fallback_reason'] = f'runway_credits:{available}<{estimated}'
          request_path.write_text(json.dumps(request, indent=2, ensure_ascii=False)+'\n')
          PY
              then
                set +e
                python studio/module_runner.py --episode "$STUDIO_EPISODE" --module host
                result=$?
                set -e
              fi
            fi

            # Persist only this episode's stage. Avoid rebasing generated state:
            # capture the episode delta, reset onto current main, then 3-way apply it.
            git add "studio/episodes/$STUDIO_EPISODE"
            if ! git diff --cached --quiet; then
              git diff --cached --binary > /tmp/studio-stage.patch
              git reset --hard HEAD
              git fetch origin main
              git reset --hard origin/main
              if git apply --3way --index /tmp/studio-stage.patch; then
                git commit -m "studio($STUDIO_EPISODE): video $module"
                git push origin HEAD:main
              else
                echo "State overlap while persisting $module; resetting to current main."
                git reset --hard origin/main
              fi
            fi
            if [[ "$result" != 0 ]]; then exit "$result"; fi
          done
          python - <<'PY'
          import json, os
          packet=json.load(open('studio/episodes/'+os.environ['STUDIO_EPISODE']+'/artifacts/assembly_manifest.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Preview video: '+packet['final_media']['url']+'\n')
          PY
      - name: Export finished video and review frames
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          import media_store, render_audio_guard, runway_media
          episode = os.environ['STUDIO_EPISODE']
          root = Path('studio/episodes') / episode / 'artifacts'
          assembly = json.loads((root / 'assembly_manifest.json').read_text())
          ref = assembly['final_media']
          out = Path('outputs/finished-video')
          out.mkdir(parents=True, exist_ok=True)
          video = out / (episode + '.mp4')
          fetched = media_store.fetch(ref['key'], video)
          if fetched['sha256'] != ref['sha256']:
              raise ValueError('Finished video checksum mismatch')
          review = Path('outputs/video-review')
          review.mkdir(parents=True, exist_ok=True)
          stats = render_audio_guard.validate(video)
          info = render_audio_guard.probe(video)
          report = {'audio': stats, 'streams': info['streams'], 'media': ref,
                    'lip_sync': assembly['lip_sync']}
          (review / 'validation.json').write_text(json.dumps(report, indent=2))
          duration = runway_media.duration(video)
          for index, seconds in enumerate((3, 20, 35, max(0, duration - 3))):
              subprocess.run(['ffmpeg','-nostdin','-y','-v','error','-ss',str(seconds),'-i',str(video),
                              '-frames:v','1','-vf','scale=540:-2',str(review / f'frame-{index}.png')],check=True)
          print(json.dumps({'url':ref['url'], 'seconds':duration, 'audio':stats},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: finished-satoshi-video-${{ github.run_id }}
          path: outputs/finished-video/*.mp4
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: satoshi-video-review-${{ github.run_id }}
          path: outputs/video-review
          retention-days: 14
      - name: Save debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-video-${{ github.run_id }}
          path: |
            studio/episodes/${{ env.STUDIO_EPISODE }}
            outputs/studio/${{ env.STUDIO_EPISODE }}
          retention-days: 14
