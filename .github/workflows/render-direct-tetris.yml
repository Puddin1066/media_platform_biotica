name: Render Direct Tetris Cut

on:
  workflow_dispatch:
  push:
    branches:
      - feature/satoshi-multi-agent-director
    paths:
      - production_specs/tetris_edit_decision.json
      - direct_tetris_remotion.py
      - remotion/src/root.tsx
      - remotion/public/direct-episode.json
      - .github/workflows/render-direct-tetris.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Build direct episode
        run: python direct_tetris_remotion.py --edl production_specs/tetris_edit_decision.json --remotion-dir remotion
      - name: Install Remotion
        run: cd remotion && npm ci
      - name: Typecheck
        run: cd remotion && npm run typecheck
      - name: Render first cut
        run: |
          mkdir -p remotion/out
          cd remotion
          npx remotion render src/index.ts DirectTetrisEpisode out/tetris-direct-first-cut.mp4
      - name: Upload first cut
        uses: actions/upload-artifact@v4
        with:
          name: tetris-direct-first-cut-${{ github.run_id }}
          path: remotion/out/tetris-direct-first-cut.mp4
          retention-days: 14
          if-no-files-found: error
